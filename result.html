<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🔮 Ваш космический портрет</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/result.css" />
    <link rel="stylesheet" href="css/animations.css" />
  </head>
  <body>
    <!-- Звёздный фон -->
    <div id="stars-container">
      <div id="stars"></div>
      <div id="stars2"></div>
      <div id="stars3"></div>
    </div>

    <div class="app-container">
      <!-- КОНТЕЙНЕР ДЛЯ PDF (ВСЁ ВНУТРИ НЕГО) -->
      <div id="reportContent" class="report-container">
        <!-- Заголовок -->
        <header class="report-header" id="reportHeader">
          <div
            class="hero-logo"
            style="text-align: center; margin: 0 auto; padding: 10px 0"
          >
            <div style="text-align: center; margin: 0 auto; padding: 5px 0">
              <!-- png Логотип -->
              <div style="text-align: center; margin-bottom: 10px;">
                  <img src="img/logo.png" alt="Светолада" style="width: 80px; height: auto;" />
              </div>
                <circle
                  cx="50"
                  cy="50"
                  r="48"
                  fill="none"
                  stroke="#ffd700"
                  stroke-width="0.5"
                  opacity="0.1"
                />
                <circle
                  cx="50"
                  cy="50"
                  r="38"
                  fill="none"
                  stroke="#ffd700"
                  stroke-width="0.5"
                  opacity="0.15"
                />
                <g transform="translate(50, 46)">
                  <path
                    d="M0 -24 L3 -7 L20 -7 L7 3 L12 18 L0 10 L-12 18 L-7 3 L-20 -7 L-3 -7 Z"
                    fill="#ffd700"
                    opacity="0.9"
                  />
                  <path
                    d="M0 -14 L2 -4 L10 -4 L4 2 L6 10 L0 5 L-6 10 L-4 2 L-10 -4 L-2 -4 Z"
                    fill="#fff"
                    opacity="0.5"
                  />
                  <circle cx="0" cy="0" r="5" fill="#fff" opacity="0.3" />
                  <circle cx="0" cy="0" r="2.5" fill="#fff" opacity="0.6" />
                  <line
                    x1="0"
                    y1="-30"
                    x2="0"
                    y2="-38"
                    stroke="#ffd700"
                    stroke-width="1.5"
                    opacity="0.2"
                  />
                  <line
                    x1="0"
                    y1="30"
                    x2="0"
                    y2="38"
                    stroke="#ffd700"
                    stroke-width="1.5"
                    opacity="0.2"
                  />
                  <line
                    x1="-30"
                    y1="0"
                    x2="-38"
                    y2="0"
                    stroke="#ffd700"
                    stroke-width="1.5"
                    opacity="0.2"
                  />
                  <line
                    x1="30"
                    y1="0"
                    x2="38"
                    y2="0"
                    stroke="#ffd700"
                    stroke-width="1.5"
                    opacity="0.2"
                  />
                  <line
                    x1="-17"
                    y1="-17"
                    x2="-24"
                    y2="-24"
                    stroke="#ffd700"
                    stroke-width="1.5"
                    opacity="0.15"
                  />
                  <line
                    x1="17"
                    y1="-17"
                    x2="24"
                    y2="-24"
                    stroke="#ffd700"
                    stroke-width="1.5"
                    opacity="0.15"
                  />
                  <line
                    x1="-17"
                    y1="17"
                    x2="-24"
                    y2="24"
                    stroke="#ffd700"
                    stroke-width="1.5"
                    opacity="0.15"
                  />
                  <line
                    x1="17"
                    y1="17"
                    x2="24"
                    y2="24"
                    stroke="#ffd700"
                    stroke-width="1.5"
                    opacity="0.15"
                  />
                </g>
                <ellipse
                  cx="50"
                  cy="46"
                  rx="38"
                  ry="10"
                  fill="none"
                  stroke="#ffd700"
                  stroke-width="0.5"
                  opacity="0.12"
                  transform="rotate(-15, 50, 46)"
                />
                <ellipse
                  cx="50"
                  cy="46"
                  rx="38"
                  ry="10"
                  fill="none"
                  stroke="#ffd700"
                  stroke-width="0.5"
                  opacity="0.08"
                  transform="rotate(15, 50, 46)"
                />
                <circle cx="18" cy="22" r="1.5" fill="#ffd700" opacity="0.25" />
                <circle cx="82" cy="25" r="1.5" fill="#ffd700" opacity="0.2" />
                <circle cx="20" cy="80" r="1.5" fill="#ffd700" opacity="0.2" />
                <circle cx="80" cy="78" r="1.5" fill="#ffd700" opacity="0.2" />
                <circle cx="10" cy="50" r="1" fill="#ffd700" opacity="0.15" />
                <circle cx="90" cy="48" r="1" fill="#ffd700" opacity="0.15" />
              </svg>

              <!-- Название -->
              <div
                style="
                  font-family: &quot;Playfair Display&quot;, serif;
                  font-size: 1.2rem;
                  font-weight: 600;
                  color: #ffd700;
                  letter-spacing: 5px;
                  margin-top: 6px;
                  text-shadow: 0 0 40px rgba(255, 215, 0, 0.05);
                "
              >
                Светолада
              </div>
              <div
                style="
                  width: 30px;
                  height: 1px;
                  background: linear-gradient(
                    90deg,
                    transparent,
                    #ffd700,
                    transparent
                  );
                  margin: 5px auto;
                "
              ></div>
              <div
                style="
                  font-size: 0.55rem;
                  color: #a8a4c8;
                  letter-spacing: 4px;
                  text-transform: uppercase;
                  font-weight: 300;
                "
              >
                космический портрет
              </div>
            </div>
          </div>
          <h1>🔮 Космический портрет</h1>
          <div class="report-user" id="reportUser">
            <p class="name">—</p>
            <p class="birth-data">—</p>
          </div>
        </header>

        <!-- Контент будет вставлен динамически сюда -->
        <div id="reportBody"></div>

        <!-- Футер внутри reportContent для PDF -->
        <footer
          class="report-footer"
          style="
            text-align: center;
            padding: 20px;
            color: #6a6690;
            font-size: 0.7rem;
            border-top: 1px solid rgba(255, 215, 0, 0.05);
            margin-top: 30px;
          "
        >
          <p>
            <strong style="color: #ffd700"> Проект создан Людмилой </strong>
            <strong style="color: #ffd700">и ИИ DeepSeek, 2026 г.</strong>
          </p>
          <p>© Светолада — космический портрет вашей души</p>
        </footer>
      </div>

      <!-- Ссылка "О проекте" (вне PDF) -->
      <div style="text-align: center; margin-top: 15px">
        <a
          href="about.html"
          style="
            color: #6a6690;
            text-decoration: none;
            font-size: 0.8rem;
            border-bottom: 1px dashed rgba(255, 215, 0, 0.1);
            padding-bottom: 2px;
          "
        >
          🌿 Узнать больше о проекте «Светолада»
        </a>
      </div>

      <!-- Сообщение с душой (вне PDF) -->
      <div
        class="heart-message"
        style="text-align: center; padding: 15px; color: #6a6690"
      >
        <p>Сделано с ❤️ и верой, что каждый может стать счастливее</p>
        <p class="sub-message" style="font-size: 0.8rem; color: #4a4670"></p>
      </div>

      <!-- Кнопки управления (вне PDF) -->
      <div
        class="report-actions"
        style="
          text-align: center;
          margin-top: 20px;
          display: flex;
          justify-content: center;
          gap: 15px;
          flex-wrap: wrap;
        "
      >
        <button
          id="downloadBtn"
          class="cosmic-btn"
          style="
            padding: 12px 30px;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 12px;
            color: #ffd700;
            cursor: pointer;
            transition: all 0.3s;
          "
        >
          <span class="btn-text">📥 Скачать PDF</span>
          <span class="btn-glow"></span>
          <span class="btn-shimmer"></span>
        </button>
        <button
          id="backBtn"
          class="btn-nav"
          onclick="window.location.href = 'index.html'"
          style="
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            color: #a8a4c8;
            cursor: pointer;
          "
        >
          <i class="fas fa-arrow-left"></i> Новый расчёт
        </button>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // 1. Забираем данные из localStorage
        const savedData = localStorage.getItem("cosmicReport");
        console.log("🔍 localStorage в result.html:", savedData);
        console.log(localStorage.getItem("cosmicReport"));

        if (!savedData) {
          document.body.innerHTML = `
            <div style="text-align: center; margin-top: 50px; color: #a8a4c8;">
              <h2>❌ Данные не найдены</h2>
              <p>Вернитесь на главную страницу и заполните форму.</p>
              <a href="index.html" style="color: #ffd700;">← На главную</a>
            </div>
          `;
          return;
        }

        try {
          const data = JSON.parse(savedData);
          console.log("📦 Данные из localStorage:", data);

          if (data && data.user) {
            console.log("✅ Данные готовы. result.js сам отрисует отчёт.");
          } else {
            console.error("❌ Некорректные данные!");
            document.body.innerHTML = `
              <div style="text-align: center; margin-top: 50px; color: #a8a4c8;">
                <h2>⚠️ Ошибка данных</h2>
                <p>Данные повреждены. Попробуйте снова.</p>
                <a href="index.html" style="color: #ffd700;">← На главную</a>
              </div>
            `;
          }
        } catch (e) {
          console.error("❌ Ошибка парсинга данных:", e);
          document.body.innerHTML = `
            <div style="text-align: center; margin-top: 50px; color: #a8a4c8;">
              <h2>⚠️ Ошибка чтения данных</h2>
              <p>Не удалось обработать данные.</p>
              <a href="index.html" style="color: #ffd700;">← На главную</a>
            </div>
          `;
        }
      });
    </script>

    <!-- ===== ПОДКЛЮЧЕНИЕ БИБЛИОТЕК ===== -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script src="js/pair-insights.js"></script>
    <script src="js/result.js"></script>
  </body>
</html>
